# ── Server ────────────────────────────────────────────────────────────────────
server.port=8080

# ── H2 File-based Database ────────────────────────────────────────────────────
# The database file is stored in ./data/aoe4randomizer.mv.db (gitignored).
# This means civ enable/disable settings persist across app restarts.
spring.datasource.url=jdbc:h2:file:./data/aoe4randomizer
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ── JPA / Hibernate ───────────────────────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# "update" keeps existing data (your toggle state) and adds new columns if needed.
spring.jpa.hibernate.ddl-auto=update

# ── Seed data (data.sql) ──────────────────────────────────────────────────────
# always = run data.sql on every startup (inserts are guarded with NOT EXISTS).
spring.sql.init.mode=always
# Make sure Hibernate creates/updates the schema BEFORE data.sql runs.
spring.jpa.defer-datasource-initialization=true

# ── Optional: H2 web console for debugging ────────────────────────────────────
# Uncomment the two lines below to enable the H2 browser console at:
#   http://localhost:8080/h2-console  (JDBC URL: jdbc:h2:file:./data/aoe4randomizer)
# spring.h2.console.enabled=true
# spring.h2.console.path=/h2-console
